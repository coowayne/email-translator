<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專業工作郵件中翻英工具</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --border: #dadce0;
      --border-focus: #4285f4;
      --bg: #f8f9fa;
      --text: #202124;
      --text-muted: #5f6368;
      --shadow-sm: 0 1px 3px rgba(60,64,67, 0.12), 0 1px 2px rgba(60,64,67, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f3f4;
      color: var(--text);
      line-height: 1.6;
      padding: 40px 16px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.06);
    }

    .header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .header h2 {
      font-size: 24px;
      font-weight: 600;
      color: #1e293b;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr; }
      .container { padding: 20px; }
    }

    label {
      font-weight: 600;
      font-size: 14px;
      display: block;
      margin-bottom: 8px;
      color: #374151;
    }

    select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background-color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus, textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.15);
    }

    textarea {
      height: 140px;
      resize: vertical;
      line-height: 1.5;
    }

    .disclaimer {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .disclaimer-icon {
      font-size: 13px;
      color: #f59e0b;
      line-height: 1.3;
    }

    .action-row {
      margin: 20px 0;
      display: flex;
      align-items: center;
    }

    button.primary-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: background 0.2s, transform 0.1s;
    }

    button.primary-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button.primary-btn:disabled {
      background: #bdc1c6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .output-section {
      margin-top: 10px;
    }

    .output-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      padding: 20px;
      min-height: 160px;
      white-space: pre-wrap;
      font-size: 14px;
      position: relative;
      color: var(--text);
      line-height: 1.6;
    }

    .output-card.active {
      background: #ffffff;
      border-color: #c2e7ff;
      box-shadow: inset 0 0 0 1px #c2e7ff;
    }

    .copy-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: background 0.15s, border-color 0.15s;
    }

    .copy-btn:hover {
      background: #f1f3f4;
      border-color: #bdc1c6;
    }

    .model-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
      background: #f1f3f4;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>專業工作郵件中翻英工具</h2>
      <p>專為現場工程、維運與商務協作設計的術語與語氣優化系統</p>
    </div>

    <!-- 屬性選單 -->
    <div class="controls">
      <div>
        <label for="categorySelect">專業領域類別：</label>
        <select id="categorySelect">
          <option value="General">日常信件 (General)</option>
          <option value="Electrical">電機工程 (Electrical)</option>
          <option value="Instrumentation">儀表控制 (Instrument)</option>
          <option value="Accounting">會計 (Accounting)</option>
        </select>
      </div>
      <div>
        <label for="toneSelect">語氣設定：</label>
        <select id="toneSelect">
          <option value="Formal">正式禮貌</option>
          <option value="Direct">簡潔直效</option>
          <option value="Casual">美式口語</option>
          <option value="Literal">中文直譯</option>
        </select>
      </div>
      <div>
        <label for="moodSelect">發信心情：</label>
        <select id="moodSelect">
          <option value="Normal">正常 (客觀中立)</option>
          <option value="Happy">愉快 (熱情正面)</option>
          <option value="Angry">生氣 (嚴肅堅定)</option>
        </select>
      </div>
    </div>

    <!-- 中文草稿輸入區 -->
    <label for="sourceText">中文信件草稿：</label>
    <textarea id="sourceText" placeholder="請輸入中文內容..."></textarea>
    
    <!-- 聲明與免責小字 -->
    <div class="disclaimer">
      <span class="disclaimer-icon">ⓘ</span>
      <span>本系統採用 Google Gemini AI 技術自動生成翻譯與商務語氣調整。模型輸出可能偶有偏差，信件發送前請務必核對關鍵設備編號、參數數值、合約條款與收件人權限。</span>
    </div>

    <!-- 操作按鈕 -->
    <div class="action-row">
      <button id="submitBtn" class="primary-btn" onclick="executeTranslation()">
        <span id="btnSpinner" class="spinner" style="display: none;"></span>
        <span id="btnText">生成英文信件</span>
      </button>
    </div>

    <!-- 英文結果展示區 -->
    <div class="output-section">
      <label>英文郵件建議：</label>
      <div class="output-card" id="outputCard">
        <button class="copy-btn" id="copyBtn" onclick="copyOutput()" style="display: none;">複製內文</button>
        <div id="outputContent" style="color: var(--text-muted);">翻譯結果將呈現於此...</div>
      </div>
      <div id="modelBadge" class="model-badge" style="display: none;"></div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://gemini-translator-proxy.wandering-poetry-ecb7.workers.dev";

    const DOMAIN_GLOSSARY = {
      General: ``,
      Electrical: `
- 電機術語對照字典（僅供置換，草稿未提及則忽略）：
  * 跳脫/復歸: trip / reset
  * 電驛/比壓/比流/開關: protection relay / PT / CT / circuit breaker
  * 送電/停電: energize / de-energize
  * 故障跳脫: trip on fault / overload
      `,
      Instrumentation: `
- 儀表術語對照字典（僅供置換，草稿未提及則忽略）：
  * 變送器: transmitter (DP transmitter, PT)
  * 漂移/校正: drift / calibrate / recalibrate
  * 控制閥動作: valve hunting, stroke test, fail-safe position
  * 回路測試: loop check
      `,
      Accounting: `
- 會計術語對照字典（僅供置換，草稿未提及則忽略）：
  * 發票/沖銷/對帳: invoice / billing / write-off / reconcile / account reconciliation
  * 逾期/付款條件: overdue / past due / payment terms
  * 傳票/報銷: voucher / journal entry / reimbursement
      `
    };

    const TONE_GUIDES = {
      Formal: '商務正式風格。文法完整嚴謹，語氣客氣尊重。',
      Direct: '簡潔直效風格。直奔主題，語句乾脆精準，無冗詞。',
      Casual: '美式職場口語風格。自然親切、使用美式職場常用短語。',
      Literal: '純文字直譯模式。嚴禁生成 Subject、開頭問候、結尾簽名或感謝句，只逐句直譯中文草稿。'
    };

    const MOOD_GUIDES = {
      Normal: '情緒客觀平實，中立理性。',
      Happy: '情緒愉快友善，語氣熱情配合。',
      Angry: '情緒嚴正堅定（Firm & Stern）。在符合職場禮貌前提下，展現問題嚴重性與緊迫感。'
    };

    async function executeTranslation() {
      const text = document.getElementById('sourceText').value.trim();
      const category = document.getElementById('categorySelect').value;
      const tone = document.getElementById('toneSelect').value;
      const mood = document.getElementById('moodSelect').value;
      
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const outputCard = document.getElementById('outputCard');
      const outputContent = document.getElementById('outputContent');
      const copyBtn = document.getElementById('copyBtn');
      const modelBadge = document.getElementById('modelBadge');

      if (!text) {
        alert('請輸入中文信件內容');
        return;
      }

      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.innerText = 'AI 轉譯中...';
      
      outputCard.classList.remove('active');
      outputContent.style.color = 'var(--text-muted)';
      outputContent.innerText = '正在處理並優化專業語氣...';
      copyBtn.style.display = 'none';
      modelBadge.style.display = 'none';

      const glossary = DOMAIN_GLOSSARY[category] || '';
      const toneInstruction = TONE_GUIDES[tone] || TONE_GUIDES.Direct;
      const isLiteral = (tone === 'Literal');
      const moodInstruction = isLiteral ? '直譯模式：忽略情緒修飾，直接直譯。' : (MOOD_GUIDES[mood] || MOOD_GUIDES.Normal);

      const formatInstruction = isLiteral
        ? `1. 絕對禁止生成 "Subject:"、稱謂或簽名結尾。
2. 絕對禁止任何客套問候或感謝句。
3. 嚴格逐句翻譯草稿，直接輸出純文字英文。`
        : `1. 格式：
   Subject: [簡短精確切合草稿主題]
   
   Dear [Name],
   [正文]
   
   Best regards,
   [Your Name]
2. 【核心嚴禁事項】：
   - 資訊量必須與中文草稿嚴格等比！草稿只寫一句話，正文就只能寫 1-2 句話。
   - 絕對禁止虛構草稿未提及的情節（如設備測試、會議日程、技術評估、待辦事項清單）。
   - 【術語對照字典】僅作為字典使用。若草稿未涉及字典中的設備或名詞，嚴禁自行塞入這些詞彙！
3. 請依照指定的語氣與心情進行文字潤飾，但不可無中生有。
4. 直接輸出信件內容，無須任何前言或結語解釋。`;

      const prompt = `
你是一位專業中翻英翻譯助手。你的唯一任務是將【中文草稿】翻譯並潤飾成英文信件。

【術語對照字典（僅供名詞置換，草稿未提及則徹底忽略）】
${glossary}

【語氣設定】: ${toneInstruction}
【發信心情】: ${moodInstruction}

【輸出格式與邊界規則】
${formatInstruction}

【中文草稿（這是唯一的事實來源，嚴禁自行延伸或腦補情節）】
${text}
      `.trim();

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || data.error);

        const generatedText = data.candidates[0].content.parts[0].text;
        outputContent.style.color = 'var(--text)';
        outputContent.innerText = generatedText;
        outputCard.classList.add('active');
        copyBtn.style.display = 'block';

        if (data.usedModel) {
          modelBadge.innerText = `⚡ 本次生成模型：${data.usedModel}`;
          modelBadge.style.display = 'inline-flex';
        }
      } catch (err) {
        outputContent.style.color = '#d93025';
        outputContent.innerText = `發生錯誤: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.innerText = '生成英文信件';
      }
    }

    function copyOutput() {
      const text = document.getElementById('outputContent').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = '已複製！';
        setTimeout(() => { btn.innerText = '複製內文'; }, 2000);
      });
    }
  </script>
</body>
</html>
