<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專業工作郵件中翻英工具</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --border: #dadce0;
      --border-focus: #4285f4;
      --bg: #f8f9fa;
      --text: #202124;
      --text-muted: #5f6368;
      --shadow-sm: 0 1px 3px rgba(60,64,67, 0.12), 0 1px 2px rgba(60,64,67, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f3f4;
      color: var(--text);
      line-height: 1.6;
      padding: 40px 16px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.06);
    }

    .header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .header h2 {
      font-size: 24px;
      font-weight: 600;
      color: #1e293b;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 三欄排版配置 */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr; }
      .container { padding: 20px; }
    }

    label {
      font-weight: 600;
      font-size: 14px;
      display: block;
      margin-bottom: 8px;
      color: #374151;
    }

    select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background-color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus, textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.15);
    }

    textarea {
      height: 140px;
      resize: vertical;
      line-height: 1.5;
    }

    .disclaimer {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .disclaimer-icon {
      font-size: 13px;
      color: #f59e0b;
      line-height: 1.3;
    }

    .action-row {
      margin: 20px 0;
      display: flex;
      align-items: center;
    }

    button.primary-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: background 0.2s, transform 0.1s;
    }

    button.primary-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button.primary-btn:disabled {
      background: #bdc1c6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .output-section {
      margin-top: 10px;
    }

    .output-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      padding: 20px;
      min-height: 160px;
      white-space: pre-wrap;
      font-size: 14px;
      position: relative;
      color: var(--text);
      line-height: 1.6;
    }

    .output-card.active {
      background: #ffffff;
      border-color: #c2e7ff;
      box-shadow: inset 0 0 0 1px #c2e7ff;
    }

    .copy-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: background 0.15s, border-color 0.15s;
    }

    .copy-btn:hover {
      background: #f1f3f4;
      border-color: #bdc1c6;
    }

    .model-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
      background: #f1f3f4;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>專業工作郵件中翻英工具</h2>
      <p>專為現場工程、維運與商務協作設計的術語與語氣優化系統</p>
    </div>

    <!-- 屬性選單（專業領域、語氣設定、心情） -->
    <div class="controls">
      <div>
        <label for="categorySelect">專業領域類別：</label>
        <select id="categorySelect">
          <option value="General">日常信件 (General)</option>
          <option value="Electrical">電機工程 (Electrical)</option>
          <option value="Instrumentation">儀表控制 (Instrument)</option>
          <option value="Accounting">會計 (Accounting)</option>
        </select>
      </div>
      <div>
        <label for="toneSelect">語氣設定：</label>
        <select id="toneSelect">
          <option value="Formal">正式禮貌</option>
          <option value="Direct">簡潔直效</option>
          <option value="Casual">美式口語</option>
          <option value="Literal">中文直譯</option>
        </select>
      </div>
      <div>
        <label for="moodSelect">發信心情：</label>
        <select id="moodSelect">
          <option value="Normal">正常 (客觀中立)</option>
          <option value="Happy">愉快 (熱情正面)</option>
          <option value="Angry">生氣 (嚴肅堅定)</option>
        </select>
      </div>
    </div>

    <!-- 中文草稿輸入區 -->
    <label for="sourceText">中文信件草稿：</label>
    <textarea id="sourceText" placeholder="請輸入中文內容..."></textarea>
    
    <!-- 聲明與免責小字 -->
    <div class="disclaimer">
      <span class="disclaimer-icon">ⓘ</span>
      <span>本系統採用 Google Gemini AI 技術自動生成翻譯與商務語氣調整。模型輸出可能偶有偏差，信件發送前請務必核對關鍵設備編號、參數數值、合約條款與收件人權限。</span>
    </div>

    <!-- 操作按鈕 -->
    <div class="action-row">
      <button id="submitBtn" class="primary-btn" onclick="executeTranslation()">
        <span id="btnSpinner" class="spinner" style="display: none;"></span>
        <span id="btnText">生成英文信件</span>
      </button>
    </div>

    <!-- 英文結果展示區 -->
    <div class="output-section">
      <label>英文郵件建議：</label>
      <div class="output-card" id="outputCard">
        <button class="copy-btn" id="copyBtn" onclick="copyOutput()" style="display: none;">複製內文</button>
        <div id="outputContent" style="color: var(--text-muted);">翻譯結果將呈現於此...</div>
      </div>
      <!-- 模型資訊標籤 -->
      <div id="modelBadge" class="model-badge" style="display: none;"></div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://gemini-translator-proxy.wandering-poetry-ecb7.workers.dev";

    // 領域專屬深度指引
    const DOMAIN_GUIDES = {
      General: `
- 著重日常工作聯繫、行程協調、跨部門協同與常規事務溝通。
- 語意流暢自然，符合現代國際職場習慣。
      `,
      Electrical: `
- 適用高低壓配電、盤體、馬達控制中心 (MCC)、保護電驛、停復電作業。
- 專用術語規範：
  * 跳脫/復歸請使用 trip / reset (切勿直譯為 jump 或 restore)。
  * 保護電驛 (Protection Relay)、比壓器/比流器 (PT / CT)、斷路器 (Breaker / VCB / ACB)。
  * 故障/異常請使用 fault / abnormal / trip on overload (過載跳脫)。
  * 送電/停電請使用 energize / de-energize。
  * 互鎖機制使用 interlock。
      `,
      Instrumentation: `
- 適用儀表、控制閥、DCS/PLC、變送器、現場校正。
- 專用術語規範：
  * 變送器請使用 transmitter (如差壓變送器 DP transmitter、壓力變送器 PT)。
  * 訊號偏移請使用 drift (如 zero drift 零點漂移)。
  * 校正請使用 calibrate / recalibrate。
  * 控制閥動作請使用 valve hunting (擺盪)、stroke test (行程測試)、fail-safe position。
  * 回路測試請使用 loop check。
      `,
      Accounting: `
- 適用財務會計、應收應付帳款 (AR/AP)、請款發票審核、對帳與審計溝通。
- 專用術語規範：
  * 發票/請款請使用 invoice / billing / claim；發票核銷/沖銷請使用 write-off / offset / reconcile。
  * 對帳請使用 bank reconciliation / account reconciliation。
  * 款項逾期請使用 overdue payment / past due；付款條件請使用 payment terms (如 Net 30)。
  * 傳票/分錄請使用 journal entry / voucher。
  * 預付款/遞延請使用 prepayment / advance payment / accrual / deferred expense。
  * 採購訂單請使用 PO (Purchase Order)；報銷請使用 reimbursement / expense report。
      `
    };

    // 語氣深度指引
    const TONE_GUIDES = {
      Formal: '用於對外原廠技術支援 (Vendor/OEM)、外部稽核、跨廠處正式報告。文法完整嚴謹，語氣客氣尊重。',
      Direct: '用於日常主管進度回報、工單紀錄、交接清單。條理清晰，重點直接列出，避免贅詞。',
      Casual: '道地美式工作口語風格（American Workplace Casual）。語句自然親切、多用主動語態與美式常見短語，可適度使用常見口語縮寫，保持職場專業。',
      Literal: '中文純文字直譯模式。嚴禁添加任何額外的問候語（如 Hi/Dear）、客套話、致謝詞（如 Thank you）或信件簽名檔（如 Best regards）。僅針對使用者提供的中文原意進行精確直譯，不產出 Email 主旨 (Subject)，直接輸出純翻譯英文段落。'
    };

    // 心情深度指引
    const MOOD_GUIDES = {
      Normal: '心情客觀平實，保持專業中立，不帶多餘主觀情緒色彩。',
      Happy: '心情愉快且熱情，多用肯定、感激與正向詞句（例如 appreciate your prompt support, glad to work on this, looking forward to），展現高度團隊合作氛圍。',
      Angry: '發信人目前處於生氣或極度不滿的狀態。請在維持職場專業禮儀（不可出現謾罵或失禮粗話）的前提下，將情緒轉化為極為嚴正、堅定（Firm & Stern）且具有急迫感的書面語氣。強調問題的不可接受性、延遲後果與責任歸屬（例如 This delay is unacceptable, Immediate action is required, Please treat this with highest urgency）。'
    };

    async function executeTranslation() {
      const text = document.getElementById('sourceText').value.trim();
      const category = document.getElementById('categorySelect').value;
      const tone = document.getElementById('toneSelect').value;
      const mood = document.getElementById('moodSelect').value;
      
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const outputCard = document.getElementById('outputCard');
      const outputContent = document.getElementById('outputContent');
      const copyBtn = document.getElementById('copyBtn');
      const modelBadge = document.getElementById('modelBadge');

      if (!text) {
        alert('請輸入中文信件內容');
        return;
      }

      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.innerText = 'AI 轉譯中...';
      
      outputCard.classList.remove('active');
      outputContent.style.color = 'var(--text-muted)';
      outputContent.innerText = '正在處理並優化專業語氣...';
      copyBtn.style.display = 'none';
      modelBadge.style.display = 'none';

      const domainInstruction = DOMAIN_GUIDES[category] || DOMAIN_GUIDES.General;
      const toneInstruction = TONE_GUIDES[tone] || TONE_GUIDES.Direct;
      const isLiteral = (tone === 'Literal');

      // 若為直譯，忽略情緒修飾詞以免破壞原句；若非直譯，融入情緒指引
      const moodInstruction = isLiteral
        ? '直譯模式下，請忽略任何心情修飾，嚴格按照原文直譯。'
        : (MOOD_GUIDES[mood] || MOOD_GUIDES.Normal);

      const formatInstruction = isLiteral
        ? `1. 嚴格禁止輸出 "Subject:"、稱謂或簽名結尾。
2. 嚴禁任何客套問候或感謝句，僅忠實翻譯輸入文字本身。
3. 嚴格遵守該領域專屬名詞規範。
4. 直接輸出翻譯後純文字段落。`
        : `1. Subject: [產生 1 個精準且符合指定語氣、心情與領域的 Email Subject]
2. Body: [包含開頭稱謂、條理清楚的陳述、具體後續行動或訴求、標準簽名結尾]
3. 嚴格遵守該領域專屬名詞與規範，禁止生硬直譯。
4. 充分體現指定的心情狀態，但絕不可失禮。
5. 直接輸出信件內容，無須額外的解釋或客套話。`;

      const prompt = `
你是一位精通跨國重工業現場、工程運作與商務財務流程的專業溝通顧問。請將中文工作草稿改寫為符合國際慣例的專業英文內容。

【領域專屬規範】
${domainInstruction}

【溝通語氣規範】
${toneInstruction}

【發信者心情傾向】
${moodInstruction}

【輸出格式要求】
${formatInstruction}

【中文草稿】
${text}
      `.trim();

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || data.error);

        const generatedText = data.candidates[0].content.parts[0].text;
        outputContent.style.color = 'var(--text)';
        outputContent.innerText = generatedText;
        outputCard.classList.add('active');
        copyBtn.style.display = 'block';

        if (data.usedModel) {
          modelBadge.innerText = `⚡ 本次生成模型：${data.usedModel}`;
          modelBadge.style.display = 'inline-flex';
        }
      } catch (err) {
        outputContent.style.color = '#d93025';
        outputContent.innerText = `發生錯誤: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.innerText = '生成英文信件';
      }
    }

    function copyOutput() {
      const text = document.getElementById('outputContent').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = '已複製！';
        setTimeout(() => { btn.innerText = '複製內文'; }, 2000);
      });
    }
  </script>
</body>
</html>
